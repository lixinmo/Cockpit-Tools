name: Cloud Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (this Mac uses macos-x86_64)
        type: choice
        default: macos-x86_64
        options:
          - macos-x86_64
          - macos-aarch64
          - macos-universal
          - windows
          - linux-x86_64
          - linux-aarch64
          - all
      native_probe:
        description: Include a native test driver for explicit local provider acceptance (no credentials)
        type: boolean
        default: false
      native_probe_only:
        description: Validate and package only the Native acceptance driver (thin macOS, no App publication)
        type: boolean
        default: false
  push:
    branches:
      - "main"
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE*'

permissions:
  contents: read

concurrency:
  group: cloud-build-${{ github.event.pull_request.number || github.ref }}-${{ inputs.platform || 'macos-x86_64' }}-${{ inputs.native_probe_only || false }}
  cancel-in-progress: true

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  CARGO_INCREMENTAL: '0'

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      universal: ${{ steps.plan.outputs.universal }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        env:
          SELECTED_PLATFORM: ${{ inputs.platform || 'macos-x86_64' }}
          CLOUD_NATIVE_PROBE_ONLY: ${{ inputs.native_probe_only || false }}
        run: node scripts/ci/cloud-build.cjs plan "$SELECTED_PLATFORM"

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync-version
      - name: Check frontend once for all selected platforms
        run: npm run typecheck
      - name: Frontend and packaging regressions
        run: |
          npm test
          npm run test:release
          node --test scripts/ci/cloud-build.test.cjs
          node scripts/check_locales.cjs
      - name: Build frontend once
        run: node node_modules/vite/bin/vite.js build
      - uses: actions/upload-artifact@v4
        with:
          name: cloud-frontend
          path: dist/
          retention-days: 1
          if-no-files-found: error

  contracts:
    name: Native and Go contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: |
            sidecars/cockpit-cliproxy/go.sum
            sidecars/cockpit-cliproxy/third_party/CLIProxyAPI/go.sum
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-contracts-v1
          workspaces: |
            tests/codex-native-connect-retry -> ../../target/local-app-cache/native-connect-retry-harness/target
            tests/codex-credits-policy
            tests/codex-auto-reset
          save-if: ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch }}
      - name: Fetch Native harness dependencies before offline verification
        run: cargo fetch --locked --manifest-path tests/codex-native-connect-retry/Cargo.toml
      - name: Native setup-only retry contract
        run: bash scripts/verify-native-connect-retry.sh
      - name: Go reference retry contract
        run: bash scripts/verify-cockpit-connect-retry.sh
      - name: Credits policy and Auto Reset contracts
        run: |
          cargo test --locked --manifest-path tests/codex-credits-policy/Cargo.toml
          cargo test --locked --manifest-path tests/codex-auto-reset/Cargo.toml

  build:
    name: Build ${{ matrix.label }}
    needs: [plan, frontend]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf pkg-config libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libnm-dev xdg-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Host build cache
        uses: ./.github/actions/host-build-cache
        with:
          target: ${{ matrix.cache_target }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecars/cockpit-cliproxy/go.mod
          cache-dependency-path: sidecars/cockpit-cliproxy/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloud-frontend
          path: dist
      - name: Build selected application
        if: inputs.native_probe_only != true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUD_BUILD_TARGET: ${{ matrix.target }}
          COCKPIT_NATIVE_APP_BUILD: ${{ matrix.native_mac }}
          COCKPIT_SKIP_CLIPROXY_BUILD: '0'
        run: node scripts/ci/cloud-build.cjs build
      - name: Native gateway capability, chat bridge and Credits regressions
        if: runner.os == 'macOS' && inputs.native_probe_only != true
        env:
          CLOUD_BUILD_TARGET: ${{ matrix.target }}
          COCKPIT_NATIVE_APP_BUILD: '1'
          COCKPIT_SKIP_CLIPROXY_BUILD: '1'
        run: node scripts/ci/cloud-build.cjs native-regressions
      - name: Package optional local Native acceptance driver
        if: runner.os == 'macOS' && inputs.native_probe == true && inputs.native_probe_only != true
        env:
          CLOUD_BUILD_TARGET: ${{ matrix.target }}
          COCKPIT_NATIVE_APP_BUILD: '1'
          COCKPIT_SKIP_CLIPROXY_BUILD: '1'
        run: node scripts/ci/cloud-build.cjs package-native-probe
      - name: Build and validate standalone Native acceptance driver
        if: runner.os == 'macOS' && inputs.native_probe_only == true
        env:
          CLOUD_BUILD_TARGET: ${{ matrix.target }}
          COCKPIT_NATIVE_APP_BUILD: '1'
          COCKPIT_SKIP_CLIPROXY_BUILD: '1'
        run: node scripts/ci/cloud-build.cjs build-native-probe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS' && (inputs.native_probe == true || inputs.native_probe_only == true)
        with:
          name: native-gateway-probe-${{ matrix.label }}
          path: native-probe-assets/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Prepare verified Universal inputs
        if: needs.plan.outputs.universal == 'true' && runner.os == 'macOS'
        env:
          CLOUD_BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/ci/cloud-build.cjs stage-universal
      - uses: actions/upload-artifact@v4
        if: needs.plan.outputs.universal == 'true' && runner.os == 'macOS'
        with:
          name: cloud-universal-${{ matrix.target }}
          path: universal-inputs/${{ matrix.target }}/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
      - name: Archive application and write provenance
        if: inputs.native_probe_only != true
        env:
          CLOUD_BUILD_TARGET: ${{ matrix.target }}
        run: node scripts/ci/cloud-build.cjs package
      - uses: actions/upload-artifact@v4
        if: inputs.native_probe_only != true
        with:
          name: cockpit-tools-${{ matrix.label }}
          path: cloud-assets/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  universal:
    name: Bundle macOS Universal without recompiling
    if: needs.plan.outputs.universal == 'true'
    needs: [plan, frontend, build]
    runs-on: macos-15
    timeout-minutes: 15
    env:
      CLOUD_BUILD_TARGET: universal-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: cloud-frontend
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: cloud-universal-aarch64-apple-darwin
          path: universal-inputs/aarch64-apple-darwin
      - uses: actions/download-artifact@v4
        with:
          name: cloud-universal-x86_64-apple-darwin
          path: universal-inputs/x86_64-apple-darwin
      - name: Verify, merge and bundle existing slices
        run: node scripts/ci/cloud-build.cjs universal
      - run: node scripts/ci/cloud-build.cjs package
      - uses: actions/upload-artifact@v4
        with:
          name: cockpit-tools-macos-universal
          path: cloud-assets/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  publish-development:
    name: Replace rolling development downloads
    needs: [plan, frontend, contracts, build, universal]
    if: >-
      always() && !cancelled() && github.event_name != 'pull_request' &&
      inputs.native_probe_only != true &&
      github.ref_name == github.event.repository.default_branch &&
      needs.contracts.result == 'success' && needs.build.result == 'success' &&
      (needs.universal.result == 'success' || needs.universal.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: cloud-development-publication
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: cockpit-tools-*
          path: downloaded-builds
      - name: Publish verified builds and remove transient artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/cloud-publish.cjs
