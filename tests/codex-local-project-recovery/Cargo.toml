[package]
name = "cockpit-codex-local-project-recovery-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
uuid = { version = "1.10", features = ["v4"] }

[build-dependencies]
quote = "1"
syn = { version = "2", features = ["full"] }

[lib]
path = "src/lib.rs"
