[package]
name = "cockpit-codex-auto-reset-tests"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
fs2 = "0.4"
sha2 = "0.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
futures-util = "0.3"
url = "2.5"

[lib]
path = "lib.rs"
