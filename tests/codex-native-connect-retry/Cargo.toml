[package]
name = "cockpit-native-connect-retry-harness"
version = "0.1.0"
edition = "2021"
[workspace]
[lib]
path = "lib.rs"
[dependencies]
reqwest = { path = "../../vendor/reqwest-0.12.28", features = ["cockpit-connect-retry", "rustls-tls-native-roots", "stream", "socks"] }
hyper-util = { path = "../../vendor/hyper-util-0.1.20", features = ["cockpit-connect-retry", "client-legacy", "http1", "http2", "tokio"] }
tokio = { version = "1", features = ["full", "test-util"] }
rustls = "0.23"
native-tls = "0.2"
libc = "0.2"
futures-util = "0.3"
axum = "0.8"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http2"] }
rcgen = "0.13"
tokio-rustls = "0.26"
tower-service = "0.3"
[patch.crates-io]
hyper-util = { path = "../../vendor/hyper-util-0.1.20" }
